[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harinseust-cachekey"
version = "0.1.0"
description = "对照影响输出的参数清单检查缓存键构成，标出遗漏因子"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "harinseust" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://harinseust.github.io"
Repository = "https://github.com/harinseust/cachekey"
Issues = "https://github.com/harinseust/cachekey/issues"

[project.scripts]
cachekey = "cachekey:main"

[tool.setuptools]
py-modules = ["cachekey"]
